# dgx-lb config for deployment qwen3.8-flash-next-single-x2 (two qs-single replicas). Installed on dgx01 as
# ~/dgx-lb/config.toml. Caps = the per-replica knee measured 2026-09-24 (concurrency.tsv
# Cap 8/node since 2026-09-24 ~05:0xZ (probe v2 P1 pooled, host ack 04:54Z): both replicas run MAX_NUM_SEQS 8 + 8192; the pooled
# think-S knee is 8/node (251.4 tok/s fleet at 16), judge-like long output >= 4/node. Prefill-heavy lanes (codex/staged)
# limit themselves to 1-2/node. History: 4 (MAX_NUM_SEQS 4) -> 3 (long prompts, 22:03Z) -> 8.
served_model = "qwen3.8-flash-next-single"
listen_host = "0.0.0.0"          # same interfaces as vLLM's 8888; VPN/LAN only, no auth (see README)
ledger_dir = "~/dgx-lb/ledger"

[timeouts]                       # seconds; startup refuses total < 600 or first_byte < 60 (BP-60)
connect = 5
first_byte = 900
idle = 300
total = 3900                     # = the lanes' hard stop, budget 3600 + 300

[queue]
max_depth = 64

[health]
interval = 5
probe_timeout = 3
eject_after = 2
readmit_after = 2

[retry]
max_attempts = 3
backoff = [0.5, 1.0, 2.0]

[[upstream]]
name = "dgx01"
url = "http://127.0.0.1:8888"
cap = 8

[[upstream]]
name = "dgx02"
url = "http://192.168.100.40:8888"   # CX7
cap = 8

[[profile]]
name = "plain"                    # body passed through unchanged
port = 8890

[[profile]]
name = "think"                    # chat_template_kwargs.enable_thinking = true merged in (other kwargs kept)
port = 8891
inject = { chat_template_kwargs = { enable_thinking = true } }

[[profile]]
name = "nothink"
port = 8892
inject = { chat_template_kwargs = { enable_thinking = false } }
