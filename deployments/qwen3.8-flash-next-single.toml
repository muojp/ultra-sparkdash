# MiaAI-Lab single-Spark recipe, mirrored with a plain vLLM lifecycle.
# Head only: worker remains unused; do not compare this with TP=2 as a pair result.
name = "qwen3.8-flash-next-single"
served_model = "qwen3.8-flash-next-single"
served_aliases = []
api_url = "http://192.168.0.100:8888"
boot_timeout_s = 2400

[containers]
head = ["vllm-fn-single"]
worker = []

[host]
recipe_dir = "/home/muo/Qwen3.8-Flash-Next-Single-DGX-Spark"
worker = "dgx02"
start = [["env", "MEMWATCH_ENABLED=0", "./start.sh"]]
stop = [["./stop.sh"]]

[lane]
model = "dgx-spark/qwen3.8-flash-next-single"
timeout_s = 3600
sessions = 4
price_input = 0.0
price_output = 0.0
price_cache_read = 0.0
# Measured 2026-09-20: enable_thinking and both honoured; thinking alone ignored.
extra = { chat_template_kwargs = { enable_thinking = false } }

[prerequisites]
notes = [
  "Single head only; 262144 native context, MTP=3, FP8 KV, max_num_seqs=4",
  "Mia-AiLab checkpoint (~99 GiB), not the dual recipe's NVIDIA checkpoint",
  "One-time packed PLE table (~27 GiB); stock vLLM image plus necessary local patches",
  "HF_HOME=/home/muo/hf-home; port 8888 shared with other deployments",
  "No supervisor, systemd timers, alert webhooks, maintenance relaunch or background memwatch deployed",
]

[observability]
telemetry = """VLLM_NO_USAGE_STATS=1, DO_NOT_TRACK=1, HF_HUB_DISABLE_TELEMETRY=1,
WANDB_DISABLED=true on the API container AND helper containers and download process.
Runtime HF_HUB_OFFLINE=1 and TRANSFORMERS_OFFLINE=1; helper containers use network=none.
No external alerts or heartbeat services. Local /metrics remains for benchmark memory evidence.
Live audit: vLLM usage=False, HF telemetry disabled=True, offline=True; restart=no,
no lifecycle helpers/systemd units, worker unused. These flags are not a network firewall."""

[prerequisites.traps]
plain_lifecycle = """Upstream start.sh starts memwatch; separate opt-in systemd supervisor
and maintenance timer relaunch the engine. Mirror defaults MEMWATCH_ENABLED=0 and explicit
Docker --restart=no. Only dgx-model/operator starts it. Keep startup memory budget and cgroup cap."""
checkpoint = "Do not substitute the existing nvidia checkpoint: quantization and PLE size differ."

first_boot_empty_archive = "Upstream log pruning exited rc=2 on an empty logs/archive directory under pipefail. Fixed on mirror ad8dec9; first boot now reaches Docker launch."
helper_snapshot_links = "Snapshot-only helper mounts broke relative HF blob links. Mirror ad8dec9 mounts HF_HOME read-only and uses the full snapshot path."
