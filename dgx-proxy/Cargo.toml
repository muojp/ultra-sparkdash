[package]
name = "dgx-proxy"
version = "0.1.0"
edition = "2021"
description = "Inference proxy for the dgx pair: model-routed load balancing and per-deployment request rewrites"
license = "MIT"

[lib]
name = "dgx_proxy"
path = "src/lib.rs"

[[bin]]
name = "dgx-proxy"
path = "src/main.rs"

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
